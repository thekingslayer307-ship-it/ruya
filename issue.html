<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruya — Issue</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .issue-page { background: var(--cream); min-height: 100vh; }
    .issue-inner { max-width: 900px; margin: 0 auto; padding: 48px 32px 80px; }

    .issue-back {
      margin-bottom: 32px;
      font-size: 13px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--burg);
    }
    .issue-back a { color: var(--burg); transition: opacity .2s; }
    .issue-back a:hover { opacity: .65; }

    .issue-meta-tag {
      display: inline-block;
      border: 1px solid var(--burg);
      color: var(--burg);
      font-size: 12px;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 20px;
      letter-spacing: .06em;
    }
    .issue-title {
      font-size: 52px;
      font-weight: 700;
      color: var(--dark-text);
      line-height: 1.1;
      margin-bottom: 10px;
    }
    .issue-date {
      font-family: 'Cormorant Garamond', serif;
      font-size: 15px;
      color: rgba(32,8,16,.5);
      margin-bottom: 44px;
    }

    /* Mockup display */
    .issue-mockup-wrap {
      width: 100%;
      margin-bottom: 48px;
      border: 1px solid rgba(73,17,28,.1);
      box-shadow: 0 6px 32px rgba(0,0,0,.12);
      overflow: hidden;
      background: #f0e8d0;
    }
    .issue-mockup-wrap img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }

    .issue-desc-full {
      font-family: 'Cormorant Garamond', serif;
      font-size: 19px;
      line-height: 1.9;
      color: var(--dark-text);
      text-align: justify;
      max-width: 700px;
      margin: 0 auto 56px;
    }

    .issue-divider {
      width: 60px;
      height: 2px;
      background: var(--burg);
      margin: 0 auto 52px;
      opacity: .45;
    }

    .issue-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(73,17,28,.18);
      padding-top: 28px;
      font-size: 12px;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .issue-nav a { color: var(--burg); transition: opacity .2s; }
    .issue-nav a:hover { opacity: .65; }

    @media (max-width: 768px) {
      .issue-title { font-size: 32px; }
      .issue-desc-full { font-size: 16px; }
      .issue-inner { padding: 28px 20px 60px; }
    }
  </style>
</head>
<body>

  <div class="top-accent"></div>
  <nav class="nav-light">
    <a href="index.html" class="logo">ruya.</a>
    <button class="nav-toggle" aria-label="Toggle menu" onclick="this.nextElementSibling.classList.toggle('open')">
      <span></span><span></span><span></span>
    </button>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About us</a></li>
      <li><a href="writers.html">Writers</a></li>
      <li><a href="gallery.html" class="active">Blog</a></li>
      <li><a href="contact.html">Contact us</a></li>
      <li><a href="promise.html">Our Promise</a></li>
    </ul>
  </nav>

  <div class="issue-page">
    <div class="issue-inner">

      <div class="issue-back"><a href="gallery.html">← Back to Gallery</a></div>

      <div id="issue-tag" class="issue-meta-tag"></div>
      <h1 id="issue-title" class="issue-title"></h1>
      <p id="issue-date" class="issue-date"></p>

      <div class="issue-mockup-wrap">
        <img id="issue-img" src="" alt="Issue mockup">
      </div>

      <p id="issue-desc" class="issue-desc-full"></p>

      <div class="issue-divider"></div>

      <div class="issue-nav">
        <a id="prev-link" href="#">← Previous Issue</a>
        <a href="gallery.html">All Issues</a>
        <a id="next-link" href="#">Next Issue →</a>
      </div>

    </div>
  </div>

  <script>
    const issues = [
      {
        title: "Midwinter Echoes",
        date: "January 2025",
        cat: "Prose",
        desc: "A quiet collection of dream-worn reflections and candle-lit memories. Each piece lingers in the space between sleep and waking — where thoughts are half-formed and feeling is everything.",
        mockup: "mockups/issue-1.jpg",
        fallback: "https://picsum.photos/seed/ruya-i1/900/640"
      },
      {
        title: "Tides of February",
        date: "February 2025",
        cat: "Ocean Symbolism",
        desc: "Poems and pieces shaped by deep waters, constellations, and tender longing. This issue dives below the surface, into the quiet pressure of things unspoken and the vast ache of open sea.",
        mockup: "mockups/issue-2.jpg",
        fallback: "https://picsum.photos/seed/ruya-i2/900/640"
      },
      {
        title: "Hearts & Letters",
        date: "March 2025",
        cat: "Visual poetry",
        desc: "Explorations of shadow, softness, and the fragile moments between day and night. A love letter to the in-between — to twilight, to almost-said, to the tenderness of ordinary things.",
        mockup: "mockups/issue-3.jpg",
        fallback: "https://picsum.photos/seed/ruya-i3/900/640"
      },
      {
        title: "Blurred Silhouettes",
        date: "April 2025",
        cat: "Poetry",
        desc: "A study of distance, identity, and the quiet spaces we inhabit. Who are we when no one is watching? This issue asks the questions we carry in the dark, and lets them breathe.",
        mockup: "mockups/issue-4.jpg",
        fallback: "https://picsum.photos/seed/ruya-i4/900/640"
      },
      {
        title: "Nocturne in Ink",
        date: "May 2025",
        cat: "Dark Academia",
        desc: "Dark, minimal meditations written in the language of night. Libraries after hours, ink-stained fingers, and the heavy beauty of knowledge sought in candlelight.",
        mockup: "mockups/issue-5.jpg",
        fallback: "https://picsum.photos/seed/ruya-i5/900/640"
      },
      {
        title: "Pastoral Fragments",
        date: "June 2025",
        cat: "Nostalgia & Memory",
        desc: "A collage of memory, landscape, and the soft stories hidden in the countryside. Fields, faded photographs, and the particular grief of places you cannot return to.",
        mockup: "mockups/issue-6.jpg",
        fallback: "https://picsum.photos/seed/ruya-i6/900/640"
      },
      {
        title: "Rooms of Light",
        date: "July 2025",
        cat: "Feminine softness",
        desc: "An intimate visual diary of stillness, femininity, and luminous spaces. Morning windows, white linen, and the sacred quiet of a room that holds you.",
        mockup: "mockups/issue-7.jpg",
        fallback: "https://picsum.photos/seed/ruya-i7/900/640"
      },
      {
        title: "Ink & Reverie",
        date: "August 2025",
        cat: "Sketchbook visuals",
        desc: "A swirling mix of sketches, handwritten thoughts, and restless imagination. Pages torn from the notebooks of dreamers who draw before they speak.",
        mockup: "mockups/issue-8.jpg",
        fallback: "https://picsum.photos/seed/ruya-i8/900/640"
      },
      {
        title: "Letters from Another Summer",
        date: "September 2025",
        cat: "Vintage storytelling",
        desc: "Vintage notes, sun-worn facades, and stories pressed into postcards. Letters never sent, summers that ended too soon, and the golden weight of what was.",
        mockup: "mockups/issue-9.jpg",
        fallback: "https://picsum.photos/seed/ruya-i9/900/640"
      }
    ];

    const params = new URLSearchParams(window.location.search);
    const id = Math.max(1, Math.min(parseInt(params.get('id') || '1'), issues.length));
    const issue = issues[id - 1];

    document.title = `Ruya — ${issue.title}`;
    document.getElementById('issue-tag').textContent = issue.cat;
    document.getElementById('issue-title').textContent = issue.title;
    document.getElementById('issue-date').textContent = issue.date;
    document.getElementById('issue-desc').textContent = issue.desc;

    // Try local mockup first, fall back to placeholder
    const img = document.getElementById('issue-img');
    img.src = issue.mockup;
    img.onerror = () => { img.src = issue.fallback; img.onerror = null; };

    const prevLink = document.getElementById('prev-link');
    const nextLink = document.getElementById('next-link');
    if (id > 1) { prevLink.href = `issue.html?id=${id - 1}`; }
    else { prevLink.style.visibility = 'hidden'; }
    if (id < issues.length) { nextLink.href = `issue.html?id=${id + 1}`; }
    else { nextLink.style.visibility = 'hidden'; }
  </script>

</body>
</html>
